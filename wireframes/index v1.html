<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>TapIn to Sales — Wireframes</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; background: #EAF3FF; font-family: 'Poppins', sans-serif; }
  .page { max-width: 1500px; margin: 0 auto; padding: 40px 32px 80px; }
  .hero { margin-bottom: 40px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #0080FF; }
  .title { font-size: 44px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; margin: 8px 0 10px; color: #141D22; }
  .lede { font-size: 17px; line-height: 1.55; color: #404569; max-width: 720px; }
  .section-label { display: flex; align-items: center; gap: 14px; margin: 44px 0 18px; }
  .section-label .n { width: 28px; height: 28px; border-radius: 50%; background: #0080FF; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .section-label h2 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .section-label .desc { margin-left: auto; font-size: 13px; color: rgba(20,29,34,.65); max-width: 420px; text-align: right; }
  .frame-row { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .frame-col { display: flex; flex-direction: column; gap: 10px; }
  .frame-col .cap { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: rgba(20,29,34,.65); }
  .frame-col .sub { font-size: 12px; color: rgba(20,29,34,.55); max-width: 280px; }
  .tabs { display: inline-flex; background: #fff; border: 1px solid #DDE4F0; border-radius: 999px; padding: 4px; gap: 2px; margin-bottom: 16px; }
  .tabs button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font-family: inherit; font-size: 12px; font-weight: 500; color: rgba(20,29,34,.65); cursor: pointer; }
  .tabs button.active { background: #0080FF; color: #fff; font-weight: 600; }
  .flow-bar { display: flex; gap: 0; background: #fff; border: 1px solid #DDE4F0; border-radius:14px; padding: 12px; margin-bottom: 20px; align-items: center; }
  .flow-bar .step { flex: 1; display: flex; align-items: center; gap: 10px; padding: 6px 12px; }
  .flow-bar .num { width: 22px; height: 22px; border-radius: 50%; background: #EAF3FF; color: #0080FF; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .flow-bar .num.dark { background: #0080FF; color: #fff; }
  .flow-bar .label { font-size: 12px; color: #141D22; font-weight: 500; line-height: 1.3; }
  .flow-bar .arrow { color: #B2CBF5; font-size: 14px; }
  .caveat { padding: 14px 18px; background: rgba(255,171,59,.12); border: 1px solid rgba(255,171,59,.35); border-radius: 12px; color: #8f5a0f; font-size: 13px; line-height: 1.5; margin-top: 18px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
/* TapIn component library — shared across all wireframe surfaces */

// Icon — stroke SVGs, matches Lucide weight
const Icon = ({ name, size = 20, color = 'currentColor' }) => {
  const p = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' };
  const paths = {
    play: <><path d="m10 7 5 3-5 3z" fill={color}/><rect x="2" y="4" width="20" height="16" rx="3"/></>,
    file: <><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/></>,
    cal: <><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></>,
    glass: <><path d="M8 2h8l4 10v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8z"/><path d="M4 12h16"/><path d="M10 12v6"/><path d="M14 12v6"/></>,
    card: <><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2.5"/><path d="M14 10h5"/><path d="M14 14h4"/></>,
    chev: <path d="m9 18 6-6-6-6"/>,
    chevUp: <path d="m18 15-6-6-6 6"/>,
    lock: <><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
    user: <><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></>,
    plus: <><path d="M12 5v14"/><path d="M5 12h14"/></>,
    check: <path d="M20 6 9 17l-5-5"/>,
    bolt: <path d="M13 2 3 14h7l-1 8 10-12h-7z" fill={color}/>,
    sparkle: <><path d="M12 3v4"/><path d="M12 17v4"/><path d="M3 12h4"/><path d="M17 12h4"/><path d="m5.6 5.6 2.8 2.8"/><path d="m15.6 15.6 2.8 2.8"/><path d="m5.6 18.4 2.8-2.8"/><path d="m15.6 8.4 2.8-2.8"/></>,
    wave: <><path d="M4 12a8 8 0 0 1 16 0"/><path d="M7.5 12a4.5 4.5 0 0 1 9 0"/><circle cx="12" cy="12" r="1.2" fill={color}/></>,
    arrow: <><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>,
    search: <><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></>,
    bell: <><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></>,
    grid: <><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></>,
    settings: <><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.5a7 7 0 0 0-2 1.2l-2.3-.9-2 3.5 2 1.5A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.5 2 3.5 2.3-.9a7 7 0 0 0 2 1.2L10 21h4l.6-2.5a7 7 0 0 0 2-1.2l2.3.9 2-3.5-2-1.5A7 7 0 0 0 19 12z"/></>,
    home: <><path d="M3 11 12 3l9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></>,
    tappoint: <><circle cx="12" cy="12" r="2.5" fill={color}/><path d="M8 12a4 4 0 0 1 8 0"/><path d="M4 12a8 8 0 0 1 16 0"/></>,
    swipe: <><path d="M7 11V5a2 2 0 0 1 4 0v6"/><path d="M11 7a2 2 0 0 1 4 0v4"/><path d="M15 9a2 2 0 0 1 4 0v7a6 6 0 0 1-12 0v-3l-2-2a1.4 1.4 0 0 1 2-2l2 2"/></>,
    link: <><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></>,
    building: <><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 9h.01M15 9h.01M9 13h.01M15 13h.01M9 17h6"/></>,
  };
  return <svg {...p}>{paths[name]}</svg>;
};

// Logo mark — the TapIn parentheses/wave mark
const TapInMark = ({ size = 28, color = '#0080FF' }) => (
  <svg width={size} height={size} viewBox="0 0 60 60" fill="none">
    <path d="M18 12c-4 7-4 29 0 37" stroke={color} strokeWidth="8" strokeLinecap="round"/>
    <path d="M34 6c6 10 6 38 0 48" stroke={color} strokeWidth="8" strokeLinecap="round"/>
  </svg>
);

// Phone frame — simplified for small mobile mockups
const Phone = ({ children, width = 320, height = 640, chromeColor = '#141D22' }) => (
  <div style={{
    width, height, borderRadius: 42, padding: 10, background: chromeColor,
    boxShadow: '0 30px 60px rgba(10,15,20,.2), 0 0 0 1px rgba(0,0,0,.1)',
    position: 'relative', flexShrink: 0,
  }}>
    <div style={{
      width: '100%', height: '100%', borderRadius: 32, overflow: 'hidden',
      background: '#fff', position: 'relative', display: 'flex', flexDirection: 'column',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 8, left: '50%', transform: 'translateX(-50%)',
        width: 88, height: 24, borderRadius: 16, background: '#000', zIndex: 10,
      }}/>
      {children}
    </div>
  </div>
);

// Salesperson mobile — the live "at the conference" screen.

// ===== App =====
const TWEAKS = /*EDITMODE-BEGIN*/{
  "motionPickerLayout": "grid"
}/*EDITMODE-END*/;

function App() {
  const [layout, setLayout] = React.useState(() => localStorage.getItem('tapin_layout') || TWEAKS.motionPickerLayout);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  React.useEffect(() => {
    localStorage.setItem('tapin_layout', layout);
  }, [layout]);

  React.useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const setLayoutPersist = (v) => {
    setLayout(v);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { motionPickerLayout: v } }, '*');
  };

  return (
    <div className="page" data-screen-label="TapIn Wireframes">
      <div className="hero">
        <div className="eyebrow">TapIn to Sales · Wireframes</div>
        <div className="title">One tap turns a conversation into data.</div>
        <div className="lede">Four surfaces, one flow — Matt sets up motions before the conference, meets a prospect at the booth, the prospect taps into a verified session, and Matt pushes brochure → happy-hour invite from his phone in real time.</div>
      </div>

      <div className="flow-bar">
        <div className="step"><span className="num dark">1</span><span className="label">Matt configures motions on desktop</span></div>
        <span className="arrow">→</span>
        <div className="step"><span className="num dark">2</span><span className="label">Prospect taps NFC, enters name + URL</span></div>
        <span className="arrow">→</span>
        <div className="step"><span className="num dark">3</span><span className="label">Matt sees ICP + picks motion on phone</span></div>
        <span className="arrow">→</span>
        <div className="step"><span className="num dark">4</span><span className="label">Prospect receives brochure, RSVPs to HH</span></div>
      </div>

      <div className="section-label" data-screen-label="01 Setup Website">
        <span className="n">1</span>
        <h2>Setup website (desktop)</h2>
        <div className="desc">Matt configures default motions + a SaaStr-specific event campaign, linking his TapIn sales card to the set.</div>
      </div>
      <div style={{ display: 'flex', justifyContent: 'center' }}>
        <SetupWebsite/>
      </div>

      <div className="section-label" data-screen-label="02 Prospect Landing">
        <span className="n">2</span>
        <h2>Prospect landing · 3 variations</h2>
        <div className="desc">Post-tap, asks name + company URL. Matt sees this appear live on his phone as the prospect types.</div>
      </div>
      <div className="frame-row">
        <div className="frame-col">
          <div className="cap">A · Hero NFC verify</div>
          <Phone><StatusBar/><ProspectLanding variant="A" stage="capture"/></Phone>
          <div className="sub">Reassuring — proves the tap worked before asking anything.</div>
        </div>
        <div className="frame-col">
          <div className="cap">B · Minimal form-first</div>
          <Phone><StatusBar/><ProspectLanding variant="B" stage="capture"/></Phone>
          <div className="sub">Fastest. "Two seconds" promise, no decoration.</div>
        </div>
        <div className="frame-col">
          <div className="cap">C · Branded sales card</div>
          <Phone><StatusBar/><ProspectLanding variant="C" stage="capture"/></Phone>
          <div className="sub">Shows Matt's card on-screen — matches the physical object in the prospect's hand.</div>
        </div>
      </div>

      <div className="section-label" data-screen-label="03 Sales Mobile">
        <span className="n">3</span>
        <h2>Salesperson live screen · 3 motion-picker layouts</h2>
        <div className="desc">Mobile. Prospect card fills in real-time with ICP score + auto-looked-up title. Swipe a motion card up to push it to the prospect's phone.</div>
      </div>

      <div className="tabs">
        {[['stack', 'Stack list'], ['grid', '2-col grid'], ['carousel', 'Horizontal carousel']].map(([v, l]) => (
          <button key={v} className={layout === v ? 'active' : ''} onClick={() => setLayoutPersist(v)}>{l}</button>
        ))}
      </div>

      <div className="frame-row">
        <div className="frame-col">
          <div className="cap">Live · idle</div>
          <Phone><StatusBar/><SalesMobile layout={layout}/></Phone>
          <div className="sub">The three layouts trade density for speed. Stack wins on scanability; grid on glanceability; carousel on tactile swipe-up feel.</div>
        </div>
        <div className="frame-col">
          <div className="cap">Live · brochure selected</div>
          <Phone><StatusBar/><SalesMobile layout={layout} activeMotion="brochure"/></Phone>
          <div className="sub">Selected card lifts. Swipe-up sends; data shown in ICP pill.</div>
        </div>
        <div className="frame-col">
          <div className="cap">Live · happy-hour selected</div>
          <Phone><StatusBar/><SalesMobile layout={layout} activeMotion="happyhour"/></Phone>
          <div className="sub">Event-only motion. Will ask prospect for email to RSVP.</div>
        </div>
      </div>

      <div className="section-label" data-screen-label="04 Prospect Experiences">
        <span className="n">4</span>
        <h2>Prospect experience pages</h2>
        <div className="desc">What the prospect sees after Matt pushes a motion. Same session, content swaps in.</div>
      </div>
      <div className="frame-row">
        <div className="frame-col">
          <div className="cap">Brochure received</div>
          <Phone><StatusBar/><ProspectLanding stage="brochure"/></Phone>
          <div className="sub">PDF preview + download. "From Matt Gropp" attribution keeps it personal.</div>
        </div>
        <div className="frame-col">
          <div className="cap">Happy Hour RSVP</div>
          <Phone><StatusBar/><ProspectLanding stage="happyhour"/></Phone>
          <div className="sub">Warm cream gradient (TapIn accent). Asks for email — only field added mid-session.</div>
        </div>
      </div>

      <div className="caveat">
        <strong>Heads-up:</strong> the admin app (<code>tap.tapin.me</code>) wasn't attached, so the Setup layout is inferred from marketing-site screenshots. Sidebar IA, iconography, and exact visual density should be confirmed against the real codebase or Figma. The motion-picker swipe interaction is new to this flow — worth usability-testing against a one-tap alternative.
      </div>

      {tweaksOpen && (
        <div style={{
          position: 'fixed', bottom: 24, right: 24, width: 260,
          background: '#fff', border: '1px solid #DDE4F0', borderRadius: 14,
          boxShadow: '0 20px 40px rgba(10,15,20,.12)', padding: 16, zIndex: 100,
        }}>
          <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: '.08em', textTransform: 'uppercase', color: '#0080FF', marginBottom: 10 }}>Tweaks</div>
          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6 }}>Motion picker layout</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {[['stack', 'Stack list'], ['grid', '2-col grid'], ['carousel', 'Carousel']].map(([v, l]) => (
              <button key={v}
                onClick={() => setLayoutPersist(v)}
                style={{
                  border: `1px solid ${layout === v ? '#0080FF' : '#DDE4F0'}`,
                  background: layout === v ? '#EAF3FF' : '#fff',
                  color: layout === v ? '#0080FF' : '#404569',
                  padding: '8px 12px', borderRadius: 8, fontFamily: 'inherit',
                  fontSize: 12, fontWeight: 500, textAlign: 'left', cursor: 'pointer',
                }}>{l}</button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
