<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>TapIn to Sales — Wireframes v2</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; background: #EEF2F6; font-family: 'Poppins', sans-serif; }
  .page { max-width: 1500px; margin: 0 auto; padding: 40px 32px 80px; }
  .hero { margin-bottom: 32px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #08699E; }
  .title { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; margin: 8px 0 10px; color: #0A0F14; }
  .lede { font-size: 16px; line-height: 1.55; color: #3B4654; max-width: 760px; }
  .section-label { display: flex; align-items: center; gap: 14px; margin: 44px 0 18px; }
  .section-label .n { width: 28px; height: 28px; border-radius: 50%; background: #08699E; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .section-label h2 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .section-label .desc { margin-left: auto; font-size: 13px; color: #5C6874; max-width: 480px; text-align: right; }
  .frame-row { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .frame-col { display: flex; flex-direction: column; gap: 10px; }
  .frame-col .cap { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #5C6874; }
  .frame-col .sub { font-size: 12px; color: #8E9BA8; max-width: 300px; line-height: 1.4; }
  .tabs { display: inline-flex; background: #fff; border: 1px solid #DDE4EB; border-radius: 999px; padding: 4px; gap: 2px; margin-bottom: 16px; }
  .tabs button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font-family: inherit; font-size: 12px; font-weight: 500; color: #5C6874; cursor: pointer; }
  .tabs button.active { background: #08699E; color: #fff; font-weight: 600; }
  .model-box { background: #fff; border: 1px solid #DDE4EB; border-radius: 14px; padding: 20px 24px; margin: 20px 0 12px; }
  .model-box h3 { margin: 0 0 14px; font-size: 14px; font-weight: 600; color: #0A0F14; }
  .model-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .model-card { padding: 14px; border: 1px solid #EEF2F6; border-radius: 10px; background: #F7F9FB; }
  .model-card .h { font-size: 12px; font-weight: 600; color: #08699E; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 6px; }
  .model-card .b { font-size: 13px; color: #0A0F14; font-weight: 600; margin-bottom: 4px; }
  .model-card .d { font-size: 11px; color: #5C6874; line-height: 1.45; }
  .caveat { padding: 14px 18px; background: rgba(255,171,59,.12); border: 1px solid rgba(255,171,59,.35); border-radius: 12px; color: #8f5a0f; font-size: 13px; line-height: 1.5; margin-top: 18px; }
  @keyframes tapin-pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
/* ═══ LIB ═══ */
const Icon = ({ name, size = 20, color = 'currentColor' }) => {
  const p = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' };
  const paths = {
    play: <><path d="m10 7 5 3-5 3z" fill={color}/><rect x="2" y="4" width="20" height="16" rx="3"/></>,
    file: <><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/></>,
    cal: <><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></>,
    glass: <><path d="M8 2h8l4 10v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8z"/><path d="M4 12h16"/><path d="M10 12v6"/><path d="M14 12v6"/></>,
    card: <><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2.5"/><path d="M14 10h5"/><path d="M14 14h4"/></>,
    lock: <><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
    user: <><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></>,
    users: <><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0"/><circle cx="17" cy="8" r="3"/><path d="M17 13a5 5 0 0 1 5 5"/></>,
    plus: <><path d="M12 5v14"/><path d="M5 12h14"/></>,
    check: <path d="M20 6 9 17l-5-5"/>,
    sparkle: <><path d="M12 3v4"/><path d="M12 17v4"/><path d="M3 12h4"/><path d="M17 12h4"/><path d="m5.6 5.6 2.8 2.8"/><path d="m15.6 15.6 2.8 2.8"/><path d="m5.6 18.4 2.8-2.8"/><path d="m15.6 8.4 2.8-2.8"/></>,
    arrow: <><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>,
    search: <><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></>,
    settings: <><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.5a7 7 0 0 0-2 1.2l-2.3-.9-2 3.5 2 1.5A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.5 2 3.5 2.3-.9a7 7 0 0 0 2 1.2L10 21h4l.6-2.5a7 7 0 0 0 2-1.2l2.3.9 2-3.5-2-1.5A7 7 0 0 0 19 12z"/></>,
    home: <path d="M3 11 12 3l9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/>,
    tappoint: <><circle cx="12" cy="12" r="2.5" fill={color}/><path d="M8 12a4 4 0 0 1 8 0"/><path d="M4 12a8 8 0 0 1 16 0"/></>,
    link: <><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></>,
    layers: <><path d="m12 2 10 6-10 6L2 8z"/><path d="m2 14 10 6 10-6"/></>,
    chart: <><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/></>,
    chevUp: <path d="m18 15-6-6-6 6"/>,
    mail: <><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></>,
    copy: <><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></>,
  };
  return <svg {...p}>{paths[name]}</svg>;
};

const TapInMark = ({ size = 28, color = 'currentColor' }) => {
  const src = (color === '#fff' || color === 'white' || (typeof color === 'string' && color.startsWith('rgba(255'))) ? '../assets/logo-wordmark-white.png' : '../assets/logo-wordmark-dark.png';
  return <img src={src} alt="TapIn" style={{ height: size, width: 'auto', display: 'block' }}/>;
};

const Phone = ({ children, width = 320, height = 640 }) => (
  <div style={{ width, height, borderRadius: 42, padding: 10, background: '#0A0F14', boxShadow: '0 30px 60px rgba(10,15,20,.2), 0 0 0 1px rgba(0,0,0,.1)', flexShrink: 0 }}>
    <div style={{ width: '100%', height: '100%', borderRadius: 32, overflow: 'hidden', background: '#fff', position: 'relative', display: 'flex', flexDirection: 'column' }}>
      <div style={{ position: 'absolute', top: 8, left: '50%', transform: 'translateX(-50%)', width: 88, height: 24, borderRadius: 16, background: '#000', zIndex: 10 }}/>
      {children}
    </div>
  </div>
);

const StatusBar = () => (
  <div style={{ height: 44, flexShrink: 0, display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', padding: '0 20px 4px', fontSize: 12, fontWeight: 600, color: '#000' }}>
    <span>9:41</span><span style={{opacity:0}}>•</span>
    <span style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
      <svg width="14" height="10" viewBox="0 0 14 10"><rect x="0" y="6" width="2.5" height="4" rx="0.5" fill="#000"/><rect x="4" y="4" width="2.5" height="6" rx="0.5" fill="#000"/><rect x="8" y="2" width="2.5" height="8" rx="0.5" fill="#000"/></svg>
      <svg width="18" height="10" viewBox="0 0 18 10"><rect x="0.5" y="0.5" width="15" height="9" rx="2" stroke="#000" strokeOpacity=".4" fill="none"/><rect x="2" y="2" width="10" height="6" rx="1" fill="#000"/></svg>
    </span>
  </div>
);

/* ═══ DESKTOP SHELL ═══ */
const DesktopShell = ({ role, setRole, route, setRoute, crumbs, children }) => {
  const isLead = role === 'lead';
  const nav = isLead ? [
    { id: 'home', name: 'Dashboard', icon: 'home' },
    { id: 'insights', name: 'Insights', icon: 'chart' },
    { id: 'leads', name: 'Leads', icon: 'user' },
    { id: 'templates', name: 'Experience Templates', icon: 'layers' },
    { id: 'events', name: 'Events', icon: 'cal' },
    { id: 'team', name: 'Teams', icon: 'users' },
    { id: 'tappoints', name: 'TapPoints', icon: 'tappoint' },
    { id: 'settings', name: 'Settings', icon: 'settings', children: [
      { id: 'members', name: 'Members & roles' },
      { id: 'integrations', name: 'Integrations' },
      { id: 'branding', name: 'Branding' },
      { id: 'billing', name: 'Billing' },
      { id: 'privacy', name: 'Data & privacy' },
    ]},
  ] : [
    { id: 'home', name: 'Dashboard', icon: 'home' },
    { id: 'myleads', name: 'Leads', icon: 'user' },
    { id: 'insights', name: 'Insights', icon: 'chart' },
    { id: 'mycard', name: 'TapIn Card', icon: 'card' },
    { id: 'myevents', name: 'Events', icon: 'cal' },
    { id: 'notifications', name: 'Notifications', icon: 'settings' },
  ];
  return (
    <div style={{ width: 1240, height: 820, background: '#F7F9FB', display: 'flex', fontFamily: 'Poppins, sans-serif', borderRadius: 14, overflow: 'hidden', border: '1px solid #DDE4EB', boxShadow: '0 20px 50px rgba(10,15,20,.08)' }}>
      <div style={{ width: 232, background: '#fff', borderRight: '1px solid #EEF2F6', display: 'flex', flexDirection: 'column' }}>
        <div style={{ padding: '18px 20px', display: 'flex', alignItems: 'center', gap: 8, borderBottom: '1px solid #EEF2F6' }}>
          <TapInMark size={22}/>
          <div style={{ fontSize: 14, fontWeight: 700 }}>TapIn</div>
          <div style={{ marginLeft: 'auto', padding: '2px 8px', borderRadius: 999, background: isLead ? '#E6F1F8' : 'rgba(131,194,21,.14)', color: isLead ? '#08699E' : '#4f7a0c', fontSize: 9, fontWeight: 700, letterSpacing: '.05em' }}>{isLead ? 'TEAM LEAD' : 'REP'}</div>
        </div>
        <div style={{ padding: '14px 10px', display: 'flex', flexDirection: 'column', gap: 2 }}>
          {nav.map(i => {
            const isActive = route === i.id || (i.children && i.children.some(c => route === c.id));
            const isOpen = i.children && isActive;
            return (
              <React.Fragment key={i.id}>
                <div onClick={() => setRoute(i.id)} style={{
                  padding: '9px 12px', borderRadius: 8, fontSize: 13,
                  display: 'flex', alignItems: 'center', gap: 10,
                  background: route === i.id ? '#E6F1F8' : 'transparent',
                  color: isActive ? '#08699E' : '#3B4654',
                  fontWeight: isActive ? 600 : 500, cursor: 'pointer',
                }}>
                  <Icon name={i.icon} size={16} color={isActive ? '#08699E' : '#5C6874'}/>{i.name}
                  {i.children && <span style={{ marginLeft: 'auto', fontSize: 9, color: '#8E9BA8', transform: isOpen ? 'rotate(90deg)' : 'none', transition: 'transform .15s' }}>▸</span>}
                </div>
                {isOpen && i.children.map(c => (
                  <div key={c.id} onClick={() => setRoute(c.id)} style={{
                    padding: '7px 12px 7px 38px', borderRadius: 8, fontSize: 12,
                    background: route === c.id ? '#E6F1F8' : 'transparent',
                    color: route === c.id ? '#08699E' : '#5C6874',
                    fontWeight: route === c.id ? 600 : 500, cursor: 'pointer',
                  }}>{c.name}</div>
                ))}
              </React.Fragment>
            );
          })}
        </div>
        <div style={{ marginTop: 'auto', padding: 14, borderTop: '1px solid #EEF2F6' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
            <div style={{ width: 30, height: 30, borderRadius: '50%', background: '#08699E', color: '#fff', display: 'grid', placeItems: 'center', fontSize: 11, fontWeight: 600 }}>{isLead ? 'MG' : 'AR'}</div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 12, fontWeight: 600 }}>{isLead ? 'Matt Gropp' : 'Ava Ramos'}</div>
              <div style={{ fontSize: 10, color: '#8E9BA8' }}>{isLead ? 'Team Lead' : 'Account Executive'}</div>
            </div>
          </div>
          {!isLead && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 1, marginBottom: 10 }}>
              {[['profile', 'My profile'], ['password', 'Password & security']].map(([id, label]) => (
                <div key={id} onClick={() => setRoute(id)} style={{
                  padding: '6px 10px', borderRadius: 6, fontSize: 11, cursor: 'pointer',
                  background: route === id ? '#E6F1F8' : 'transparent',
                  color: route === id ? '#08699E' : '#5C6874',
                  fontWeight: route === id ? 600 : 500,
                }}>{label}</div>
              ))}
            </div>
          )}
          <button onClick={() => setRole(isLead ? 'rep' : 'lead')} style={{ width: '100%', background: '#F7F9FB', border: '1px solid #DDE4EB', borderRadius: 8, padding: '6px 10px', fontSize: 10, fontWeight: 600, color: '#5C6874', cursor: 'pointer', fontFamily: 'inherit' }}>Switch to {isLead ? 'Rep' : 'Team Lead'} view</button>
        </div>
      </div>
      <div style={{ flex: 1, overflowY: 'auto' }}>
        <div style={{ padding: '14px 28px', borderBottom: '1px solid #EEF2F6', background: '#fff', display: 'flex', alignItems: 'center', gap: 8 }}>
          {crumbs.map((c, i) => (
            <React.Fragment key={i}>
              {i > 0 && <span style={{ color: '#C3CED8' }}>›</span>}
              <div style={{ fontSize: 12, color: i === crumbs.length - 1 ? '#0A0F14' : '#8E9BA8', fontWeight: i === crumbs.length - 1 ? 600 : 500 }}>{c}</div>
            </React.Fragment>
          ))}
        </div>
        {children}
      </div>
    </div>
  );
};

/* ═══ PAGE: EVENTS LIST (Lead) ═══ */
const EventsList = ({ setRoute }) => (
  <div style={{ padding: '24px 28px' }}>
    <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginBottom: 22 }}>
      <div>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: '.08em', textTransform: 'uppercase', color: '#08699E' }}>Events</div>
        <div style={{ fontSize: 28, fontWeight: 600, letterSpacing: '-.02em', marginTop: 4 }}>Every event, one place</div>
        <div style={{ fontSize: 13, color: '#5C6874', marginTop: 4 }}>Create an event, assign a template + team, and TapIn activates their cards for that window.</div>
      </div>
      <button onClick={() => setRoute('newevent')} style={{ background: '#08699E', color: '#fff', border: 0, borderRadius: 999, padding: '9px 18px', fontWeight: 600, fontSize: 13, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6, fontFamily: 'inherit' }}>
        <Icon name="plus" size={14} color="#fff"/> New Event
      </button>
    </div>
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14, marginBottom: 22 }}>
      {[
        { label: 'Upcoming', n: '3', sub: 'Next: SaaStr · Oct 14' },
        { label: 'Live now', n: '1', sub: 'HubSpot INBOUND · Day 2' },
        { label: 'Leads this quarter', n: '1,482', sub: '+38% vs Q3' },
      ].map(s => (
        <div key={s.label} style={{ padding: 18, background: '#fff', border: '1px solid #DDE4EB', borderRadius: 14 }}>
          <div style={{ fontSize: 11, color: '#8E9BA8', fontWeight: 500 }}>{s.label}</div>
          <div style={{ fontSize: 30, fontWeight: 600, letterSpacing: '-.02em', marginTop: 4 }}>{s.n}</div>
          <div style={{ fontSize: 11, color: '#5C6874', marginTop: 2 }}>{s.sub}</div>
        </div>
      ))}
    </div>
    <div style={{ background: '#fff', border: '1px solid #DDE4EB', borderRadius: 14, overflow: 'hidden' }}>
      <div style={{ display: 'grid', gridTemplateColumns: '2fr 1.3fr 1fr 1fr 90px', padding: '12px 20px', fontSize: 10, fontWeight: 600, color: '#8E9BA8', letterSpacing: '.06em', textTransform: 'uppercase', background: '#F7F9FB', borderBottom: '1px solid #EEF2F6' }}>
        <div>Event</div><div>Template</div><div>Team</div><div>Leads</div><div>Status</div>
      </div>
      {[
        { n: 'HubSpot INBOUND 2026', loc: 'Boston · Sep 9–11', tpl: 'Event Booth (Enterprise)', team: '6 reps', leads: 412, status: 'Live', sc: '#4f7a0c', sb: 'rgba(131,194,21,.14)' },
        { n: 'SaaStr Annual 2026', loc: 'San Francisco · Oct 14–16', tpl: 'Event Booth (SMB)', team: '4 reps', leads: 0, status: 'Scheduled', sc: '#08699E', sb: '#E6F1F8' },
        { n: 'Dreamforce 2026', loc: 'San Francisco · Sep 15–18', tpl: 'Event Booth (Enterprise)', team: '8 reps', leads: 0, status: 'Draft', sc: '#5C6874', sb: '#EEF2F6' },
        { n: 'Money 20/20', loc: 'Las Vegas · Oct 26–29', tpl: 'Event Booth (Enterprise)', team: '3 reps', leads: 0, status: 'Scheduled', sc: '#08699E', sb: '#E6F1F8' },
        { n: 'Web Summit Lisbon', loc: 'Lisbon · Nov 3–6', tpl: 'Conference (EU)', team: '2 reps', leads: 0, status: 'Scheduled', sc: '#08699E', sb: '#E6F1F8' },
        { n: 'RSA 2026', loc: 'San Francisco · Apr 27–May 1', tpl: '— none —', team: '—', leads: 1240, status: 'Closed', sc: '#8E9BA8', sb: '#EEF2F6' },
      ].map((e, i) => (
        <div key={i} style={{ display: 'grid', gridTemplateColumns: '2fr 1.3fr 1fr 1fr 90px', padding: '14px 20px', alignItems: 'center', borderTop: i ? '1px solid #EEF2F6' : 0, cursor: 'pointer' }} onClick={() => setRoute('eventdetail')} title="Click to view & edit template, team">
          <div>
            <div style={{ fontSize: 13, fontWeight: 600 }}>{e.n}</div>
            <div style={{ fontSize: 11, color: '#5C6874', marginTop: 2 }}>{e.loc}</div>
          </div>
          <div style={{ fontSize: 12, color: '#3B4654', display: 'flex', alignItems: 'center', gap: 6 }}>
            {e.tpl !== '— none —' && <Icon name="layers" size={12} color="#08699E"/>}{e.tpl}
          </div>
          <div style={{ fontSize: 12 }}>{e.team}</div>
          <div style={{ fontSize: 12, fontWeight: 600 }}>{e.leads || '—'}</div>
          <div style={{ padding: '3px 10px', borderRadius: 999, background: e.sb, color: e.sc, fontSize: 10, fontWeight: 600, display: 'inline-flex', alignItems: 'center', justifySelf: 'start' }}>{e.status}</div>
        </div>
      ))}
    </div>
  </div>
);

/* ═══ PAGE: EVENT DETAIL (Lead) ═══ */
const EventDetail = () => (
  <div style={{ padding: '24px 28px' }}>
    <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginBottom: 22 }}>
      <div>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: '.08em', textTransform: 'uppercase', color: '#08699E' }}>Event</div>
        <div style={{ fontSize: 28, fontWeight: 600, letterSpacing: '-.02em', marginTop: 4 }}>SaaStr Annual 2026</div>
        <div style={{ fontSize: 13, color: '#5C6874', marginTop: 4 }}>San Francisco · Oct 14–16, 2026 · Booth 42</div>
      </div>
      <div style={{ display: 'flex', gap: 10 }}>
        <div style={{ padding: '6px 12px', borderRadius: 999, background: '#E6F1F8', color: '#08699E', fontSize: 11, fontWeight: 600 }}>Scheduled · 28 days</div>
        <button style={{ background: '#fff', border: '1px solid #DDE4EB', borderRadius: 999, padding: '7px 14px', fontSize: 12, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit' }}>Preview landing</button>
        <button style={{ background: '#08699E', color: '#fff', border: 0, borderRadius: 999, padding: '7px 16px', fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>Go live early</button>
      </div>
    </div>

    <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr', gap: 16 }}>
      {/* Left: template assignment */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div style={{ background: '#fff', border: '1px solid #DDE4EB', borderRadius: 14, padding: 18 }}>
          <div style={{ display: 'flex', alignItems: 'center', marginBottom: 12 }}>
            <div>
              <div style={{ fontSize: 14, fontWeight: 600 }}>Experience template</div>
              <div style={{ fontSize: 11, color: '#5C6874', marginTop: 2 }}>What each rep's card will do at this event</div>
            </div>
            <button style={{ marginLeft: 'auto', background: 'transparent', border: '1px solid #DDE4EB', borderRadius: 999, padding: '5px 12px', fontSize: 11, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit' }}>Change</button>

/* ═══ APP ═══ */
const TWEAKS = /*EDITMODE-BEGIN*/{
  "motionPickerLayout": "grid",
  "defaultRole": "lead"
}/*EDITMODE-END*/;

function App() {
  const [role, setRole] = React.useState(() => localStorage.getItem('tapin_role') || TWEAKS.defaultRole);
  const [route, setRoute] = React.useState('events');
  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  React.useEffect(() => { localStorage.setItem('tapin_role', role); }, [role]);
  React.useEffect(() => {
    // default route per role
    setRoute(role === 'lead' ? 'home' : 'home');
  }, [role]);
  React.useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const isLead = role === 'lead';

  const renderPage = () => {
    if (!isLead) {
      if (route === 'profile') return <RepSettingsPage tab="profile"/>;
      if (route === 'notifications' || route === 'settings') return <RepSettingsPage tab="notifications"/>;
      if (route === 'password') return <RepSettingsPage tab="password"/>;
      if (route === 'myleads') return <RepLeads/>;
      if (route === 'insights') return <RepInsights/>;
      if (route === 'mycard') return <RepCard/>;
      if (route === 'myevents') return <RepEvents/>;
      return <RepHome/>;
    }
    if (route === 'home') return <LeadDashboard/>;
    if (route === 'insights') return <LeadInsights/>;
    if (route === 'leads') return <LeadLeads/>;
    if (route === 'team') return <LeadTeams/>;
    if (route === 'tappoints') return <LeadTapPoints/>;
    if (route === 'events') return <EventsList setRoute={setRoute}/>;
    if (route === 'newevent') return <NewEventPage setRoute={setRoute}/>;
    if (route === 'eventdetail') return <EventDetail/>;
    if (route === 'templates') return <TemplatesPage/>;
    if (route === 'settings') return isLead ? <LeadSettingsPage section="workspace"/> : <RepSettingsPage tab="profile"/>;
    if (route === 'members') return <LeadSettingsPage section="members"/>;
    if (route === 'integrations') return <LeadSettingsPage section="integrations"/>;
    if (route === 'branding') return <LeadSettingsPage section="branding"/>;
    if (route === 'billing') return <LeadSettingsPage section="billing"/>;
    if (route === 'privacy') return <LeadSettingsPage section="privacy"/>;
    return <LeadDashboard/>;
  };

  const crumbs = isLead
    ? (route === 'eventdetail' ? ['Events', 'SaaStr Annual 2026']
      : route === 'newevent' ? ['Events', 'New event']
      : ['members','integrations','branding','billing','privacy'].includes(route) ? ['Settings', { members: 'Members & roles', integrations: 'Integrations', branding: 'Branding', billing: 'Billing', privacy: 'Data & privacy' }[route]]
      : [{ home: 'Dashboard', insights: 'Insights', leads: 'Leads', team: 'Teams', tappoints: 'TapPoints', events: 'Events', templates: 'Experience Templates', settings: 'Settings' }[route] || 'Dashboard'])
    : (route === 'profile' ? ['My profile']
      : route === 'password' ? ['Password & security']
      : [{ home: 'My Dashboard', myleads: 'Leads', insights: 'Insights', mycard: 'TapIn Card', myevents: 'Events', notifications: 'Notifications', settings: 'Notifications' }[route] || 'My Dashboard']);

  return (
    <div className="page" data-screen-label="TapIn Wireframes v2">
      <div className="hero">
        <div className="eyebrow">TapIn to Sales · Wireframes v2</div>
        <div className="title">Templates. Events. Cards in the right hands.</div>
        <div className="lede">Rebuilt IA around the objects that actually matter. A <b>Default Digital Card</b> for every rep, <b>Experience Templates</b> you author once, and <b>Events</b> that assign a template + a team. Team Leads see the org; reps see themselves.</div>
      </div>

      {/* Domain model */}
      <div className="model-box">
        <h3>Domain model</h3>
        <div className="model-grid">
          <div className="model-card">
            <div className="h">Experience Template</div>
            <div className="b">Reusable motion set</div>
            <div className="d">A named bundle of motions (brochure, video, RSVP, meeting, card). Edit once, update everywhere. <b>TPL-001</b> is the always-on Default Digital Card.</div>
          </div>
          <div className="model-card">
            <div className="h">Event</div>
            <div className="b">When &amp; who</div>
            <div className="d">Points an <b>Experience Template</b> at a <b>team</b> during a date window. Cards auto-activate at start, revert to Default at end. Event-only overrides allowed.</div>
          </div>
          <div className="model-card">
            <div className="h">Rep &amp; Card</div>
            <div className="b">Person + TapPoint</div>
            <div className="d">Each rep has a default digital card. Team Leads assign reps to events; reps only see the events and leads that belong to them.</div>
          </div>
        </div>
      </div>

      {/* Role toggle */}
      <div className="section-label" data-screen-label="01 Admin Website">
        <span className="n">1</span>
        <h2>Admin website · role-aware</h2>
        <div className="desc">Same codebase, different IA. Team Leads manage Events, Templates &amp; Team. Reps see only their own events, card, and leads.</div>
      </div>
      <div className="tabs">
        <button className={isLead ? 'active' : ''} onClick={() => setRole('lead')}>Team Lead view</button>
        <button className={!isLead ? 'active' : ''} onClick={() => setRole('rep')}>Rep view</button>
      </div>

      {isLead && (
        <div className="tabs" style={{ marginLeft: 8 }}>
          {[['home', 'Dashboard'], ['insights', 'Insights'], ['leads', 'Leads'], ['events', 'Events'], ['newevent', 'New event'], ['eventdetail', 'Event detail'], ['templates', 'Templates'], ['team', 'Teams'], ['tappoints', 'TapPoints'], ['settings', 'Settings']].map(([v, l]) => (
            <button key={v} className={route === v ? 'active' : ''} onClick={() => setRoute(v)}>{l}</button>
          ))}
        </div>
      )}
      {!isLead && (
        <div className="tabs" style={{ marginLeft: 8 }}>
          {[['home', 'Dashboard'], ['myleads', 'Leads'], ['insights', 'Insights'], ['mycard', 'TapIn Card'], ['myevents', 'Events'], ['settings', 'Profile']].map(([v, l]) => (
            <button key={v} className={route === v ? 'active' : ''} onClick={() => setRoute(v)}>{l}</button>
          ))}
        </div>
      )}

      <div style={{ display: 'flex', justifyContent: 'center', marginTop: 8 }}>
        <DesktopShell role={role} setRole={setRole} route={route} setRoute={setRoute} crumbs={Array.isArray(crumbs) ? crumbs : [crumbs]}>
          {renderPage()}
        </DesktopShell>
      </div>

      {/* Mobile: sales live */}
      <div className="section-label" data-screen-label="02 Sales Mobile">
        <span className="n">2</span>
        <h2>Rep phone · live at the booth</h2>
        <div className="desc">Reads the template assigned to the current event. Motion grid is the chosen layout. Swipe up a card to push it to the prospect's phone.</div>
      </div>
      <div className="frame-row">
        <div className="frame-col">
          <div className="cap">Idle · waiting for tap</div>
          <Phone><StatusBar/><SalesMobile idle/></Phone>
          <div className="sub">Template name &amp; event label up top so the rep always knows which motion set they're running.</div>
        </div>
        <div className="frame-col">
          <div className="cap">Session started · waiting for contact</div>
          <Phone><StatusBar/><SalesMobile preContact/></Phone>
          <div className="sub">Session opens the moment a prospect taps. Motion grid is disabled until the rep captures name + company URL.</div>
        </div>
        <div className="frame-col">
          <div className="cap">Enriching · firmographics loading</div>
          <Phone><StatusBar/><SalesMobile activeMotion="brochure" match="match" enriching/></Phone>
          <div className="sub">Name + URL captured → the card pulses teal while TapIn pulls company, title, and ICP match from the domain.</div>
        </div>
        <div className="frame-col">
          <div className="cap">Prospect in session · brochure ready</div>
          <Phone><StatusBar/><SalesMobile activeMotion="brochure" match="match"/></Phone>
          <div className="sub">Enrichment complete. ICP match pill lands, motion cards unlock, rep picks what to send.</div>
        </div>
        <div className="frame-col">
          <div className="cap">Motion statuses · delivery loop</div>
          <Phone><StatusBar/><SalesMobile activeMotion="meeting" match="match" sent={[
            { id: 'brochure', status: 'tapped', time: 'Tapped · 30s ago' },
            { id: 'video', status: 'sent', time: 'Sent · 2 min ago' },
            { id: 'happyhour', status: 'accepted', time: 'Invite accepted' },
          ]}/></Phone>
          <div className="sub">Each sent card shows its live status — <b>Sent → Tapped → Booked → Accepted</b> — wired to the rep's notification prefs.</div>
        </div>
      </div>

      {/* Prospect surfaces */}
      <div className="section-label" data-screen-label="03 Prospect Experiences">
        <span className="n">3</span>
        <h2>Prospect phone · capture + experiences</h2>
        <div className="desc">Landing uses the branded sales-card treatment. Experience pages render whatever motion the rep pushes, inside the same session.</div>
      </div>
      <div className="frame-row">
        <div className="frame-col">
          <div className="cap">Landing · tap verified</div>
          <Phone><StatusBar/><ProspectCapture/></Phone>
          <div className="sub">Branded sales-card header mirrors the physical card the prospect just tapped.</div>
        </div>
        <div className="frame-col">
          <div className="cap">Brochure motion</div>
          <Phone><StatusBar/><ProspectBrochure/></Phone>
          <div className="sub">"From Matt Gropp" attribution keeps it personal.</div>
        </div>
        <div className="frame-col">
          <div className="cap">Video motion</div>
          <Phone><StatusBar/><ProspectVideo/></Phone>
          <div className="sub">90-sec demo. Dark surface keeps focus on the content; CTA after the play.</div>
        </div>
      </div>
      <div className="frame-row" style={{ marginTop: 14 }}>
        <div className="frame-col">
          <div className="cap">Book Meeting motion</div>
          <Phone><StatusBar/><ProspectMeeting/></Phone>
          <div className="sub">Inline calendar — no redirect. Uses the rep's calendar link from their profile.</div>
        </div>
        <div className="frame-col">
          <div className="cap">Happy Hour motion</div>
          <Phone><StatusBar/><ProspectHappyHour/></Phone>
          <div className="sub">Warm cream accent for non-deal moments. Email added only here, not on landing.</div>
        </div>
        <div className="frame-col" style={{ opacity: 0 }}/>
      </div>

      <div className="caveat" style={{ background: 'rgba(8,105,158,.08)', borderColor: 'rgba(8,105,158,.25)', color: '#0A4D72' }}>
        <strong>Decisions locked in this round:</strong> (1) A rep can only be on <b>one event at a time</b>. (2) Reps can <b>clone company templates</b> into their own personal templates. (3) Every card is <b>linked to a sales rep</b>; outside event windows it uses the rep's <b>default personal template</b> (cloneable from a company template). (4) CRM push is <b>per session</b>. (5) Offline sessions queue locally and <b>retry when back online</b> — queued count shows on the rep dashboard next to each event.
      </div>

      {tweaksOpen && (
        <div style={{ position: 'fixed', bottom: 24, right: 24, width: 280, background: '#fff', border: '1px solid #DDE4EB', borderRadius: 14, boxShadow: '0 20px 40px rgba(10,15,20,.12)', padding: 16, zIndex: 100 }}>
          <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: '.08em', textTransform: 'uppercase', color: '#08699E', marginBottom: 10 }}>Tweaks</div>
          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6 }}>Role</div>
          <div style={{ display: 'flex', gap: 6, marginBottom: 14 }}>
            {[['lead', 'Team Lead'], ['rep', 'Rep']].map(([v, l]) => (
              <button key={v} onClick={() => setRole(v)} style={{ flex: 1, border: `1px solid ${role === v ? '#08699E' : '#DDE4EB'}`, background: role === v ? '#E6F1F8' : '#fff', color: role === v ? '#08699E' : '#3B4654', padding: '8px 12px', borderRadius: 8, fontFamily: 'inherit', fontSize: 12, fontWeight: 500, cursor: 'pointer' }}>{l}</button>
            ))}
          </div>
          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6 }}>Admin page</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {(isLead ? [['events', 'Events'], ['newevent', 'New event'], ['eventdetail', 'Event detail'], ['templates', 'Templates'], ['settings', 'Settings · CRM']] : [['home', 'My Dashboard'], ['settings', 'Settings · Profile']]).map(([v, l]) => (
              <button key={v} onClick={() => setRoute(v)} style={{ border: `1px solid ${route === v ? '#08699E' : '#DDE4EB'}`, background: route === v ? '#E6F1F8' : '#fff', color: route === v ? '#08699E' : '#3B4654', padding: '8px 12px', borderRadius: 8, fontFamily: 'inherit', fontSize: 12, fontWeight: 500, textAlign: 'left', cursor: 'pointer' }}>{l}</button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
