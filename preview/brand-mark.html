<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_styles.css"/>
<style></style>
</head><body><div class="card">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
    <div style="background:var(--canvas);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;display:flex;align-items:center;justify-content:center;min-height:130px;">
      <img src="../assets/tapin-mark-dark.png" alt="" style="height:60px;width:auto;"/>
    </div>
    <div style="background:var(--ink-900);border-radius:var(--r-lg);padding:24px;display:flex;align-items:center;justify-content:center;min-height:130px;">
      <img src="../assets/tapin-mark-white.png" alt="" style="height:60px;width:auto;"/>
    </div>
    <div style="background:var(--tapin-blue);border-radius:var(--r-lg);padding:24px;display:flex;align-items:center;justify-content:center;min-height:130px;">
      <img src="../assets/tapin-mark-white.png" alt="" style="height:60px;width:auto;"/>
    </div>
   </div>
   <div class="row" style="margin-top:12px;justify-content:space-between;">
     <div><div class="label">Signal mark</div><div style="font-size:12px;color:var(--ink-700);margin-top:4px;">Favicon, badges, square avatars</div></div>
     <span class="mono" style="font-size:10px;color:var(--ink-600);">24 / 32 / 48 / 64</span>
   </div>
</div></body></html>
