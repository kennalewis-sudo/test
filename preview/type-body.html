<!-- @dsCard group="Type" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_styles.css"/>
<style></style>
</head><body><div class="card">
<div class="label" style="margin-bottom:14px;">Body · small · caption · eyebrow</div>
   <div class="col" style="gap:14px;">
     <div style="display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;">
       <span class="t-body">Tap-points configured across all your spaces, grouped by experience.</span>
       <span class="mono" style="font-size:10px;color:var(--ink-600);">Body · 14/22 · 400</span>
     </div>
     <div style="display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;border-top:1px solid var(--line);padding-top:12px;">
       <span class="t-small">Last sync: 2 minutes ago</span>
       <span class="mono" style="font-size:10px;color:var(--ink-600);">Small · 13/20 · 400</span>
     </div>
     <div style="display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;border-top:1px solid var(--line);padding-top:12px;">
       <span class="t-caption">11 unique visitors</span>
       <span class="mono" style="font-size:10px;color:var(--ink-600);">Caption · 11/16 · 500</span>
     </div>
     <div style="display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;border-top:1px solid var(--line);padding-top:12px;">
       <span class="t-eyebrow">Engagement · last 7 days</span>
       <span class="mono" style="font-size:10px;color:var(--ink-600);">Eyebrow · 11 · 700 · +10%</span>
     </div>
   </div>
</div></body></html>
