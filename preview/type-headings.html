<!-- @dsCard group="Type" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_styles.css"/>
<style></style>
</head><body><div class="card">
<div class="label" style="margin-bottom:14px;">Headings · Poppins</div>
   <div class="col" style="gap:14px;">
     <div style="display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;">
       <span class="t-display" style="font-size:42px;">Calm signal.</span>
       <span class="mono" style="font-size:10px;color:var(--ink-600);">Display · 56/57 · 700</span>
     </div>
     <div style="display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;border-top:1px solid var(--line);padding-top:12px;">
       <span class="t-h1">Dashboard overview</span>
       <span class="mono" style="font-size:10px;color:var(--ink-600);">H1 · 32/37 · 600</span>
     </div>
     <div style="display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;border-top:1px solid var(--line);padding-top:12px;">
       <span class="t-h2">Spaces &amp; Experiences</span>
       <span class="mono" style="font-size:10px;color:var(--ink-600);">H2 · 24/28 · 500</span>
     </div>
     <div style="display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;border-top:1px solid var(--line);padding-top:12px;">
       <span class="t-h3">Top experiences this week</span>
       <span class="mono" style="font-size:10px;color:var(--ink-600);">H3 · 20/26 · 500</span>
     </div>
     <div style="display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;border-top:1px solid var(--line);padding-top:12px;">
       <span class="t-h4">Total taps</span>
       <span class="mono" style="font-size:10px;color:var(--ink-600);">H4 · 16/19 · 700</span>
     </div>
   </div>
</div></body></html>
