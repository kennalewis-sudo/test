<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_styles.css"/>
<style></style>
</head><body><div class="card">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
    <div style="background:var(--canvas);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;display:flex;align-items:center;justify-content:center;min-height:140px;">
      <img src="../assets/tapin-logo-dark.png" alt="TapIn" style="height:54px;width:auto;display:block;"/>
    </div>
    <div style="background:var(--ink-900);border-radius:var(--r-lg);padding:28px;display:flex;align-items:center;justify-content:center;min-height:140px;">
      <img src="../assets/tapin-logo-white.png" alt="TapIn" style="height:54px;width:auto;display:block;"/>
    </div>
   </div>
   <div class="row" style="margin-top:12px;justify-content:space-between;align-items:flex-start;">
     <div><div class="label">Primary lockup</div><div style="font-size:12px;color:var(--ink-700);margin-top:4px;">Light + inverse · use only on Ink&nbsp;900 or White</div></div>
     <span class="mono" style="font-size:10px;color:var(--ink-600);">tapin-logo-dark.png · tapin-logo-white.png</span>
   </div>
</div></body></html>
