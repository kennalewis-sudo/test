<!-- @dsCard group="Colors" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_styles.css"/>
<style></style>
</head><body><div class="card">
<div class="label" style="margin-bottom:10px;">Semantic · status + AI</div>
   <div class="grid-5">
    <div style="border:1px solid var(--line);border-radius:var(--r-md);padding:12px;">
        <span class="pill" style="background:#E2FBE9;color:#0B6A00;margin-bottom:10px;">Success</span>
        <div style="font-size:11px;color:var(--ink-700);line-height:1.45;">Active, +delta, completion</div>
      </div><div style="border:1px solid var(--line);border-radius:var(--r-md);padding:12px;">
        <span class="pill" style="background:#FBE2E2;color:#6A0000;margin-bottom:10px;">Danger</span>
        <div style="font-size:11px;color:var(--ink-700);line-height:1.45;">Destructive, error, lost</div>
      </div><div style="border:1px solid var(--line);border-radius:var(--r-md);padding:12px;">
        <span class="pill" style="background:#FFF1DC;color:#C97200;margin-bottom:10px;">Warning</span>
        <div style="font-size:11px;color:var(--ink-700);line-height:1.45;">Pending, at-risk, quota</div>
      </div><div style="border:1px solid var(--line);border-radius:var(--r-md);padding:12px;">
        <span class="pill" style="background:rgba(0,125,249,0.14);color:#0B59B2;margin-bottom:10px;">Info</span>
        <div style="font-size:11px;color:var(--ink-700);line-height:1.45;">Notifications, beta</div>
      </div><div style="border:1px solid var(--line);border-radius:var(--r-md);padding:12px;">
        <span class="pill" style="background:rgba(138,82,234,0.14);color:#6E33CC;margin-bottom:10px;">AI</span>
        <div style="font-size:11px;color:var(--ink-700);line-height:1.45;">Generative output only</div>
      </div>
   </div>
</div></body></html>
