<!-- @dsCard group="Brand" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_styles.css"/>
<style></style>
</head><body><div class="card">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
    <div style="border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;background:var(--tapin-blue-50);">
      <div class="label" style="color:var(--success-fg);">Do</div>
      <div style="font-size:15px;font-weight:600;color:var(--ink-900);margin:6px 0 6px;">"3 spaces. 12 experiences. 1,402 taps this week."</div>
      <div style="font-size:11.5px;color:var(--ink-600);line-height:1.5;">Lead with the number. Sentence fragments. Trust the reader.</div>
    </div>
    <div style="border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;background:#FDF5F5;">
      <div class="label" style="color:var(--danger-strong);">Don't</div>
      <div style="font-size:15px;font-weight:600;color:var(--ink-900);margin:6px 0 6px;">"Welcome back! Your dashboard is ready to provide rich insights…"</div>
      <div style="font-size:11.5px;color:var(--ink-600);line-height:1.5;">No hype, no emoji, no "rich insights." The product is the proof.</div>
    </div>
   </div>
</div></body></html>
